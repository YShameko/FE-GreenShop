<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Green Shop</title>
</head>
<body>
    <!-- --------------------------          H E A D E R          -------------------------- -->
    <header class="header container fnt-sz0">
        <div class="header-logo inline-block vrt-align-top">
            <img src="img/logo-greenshop.svg" alt="Green shop logo, in the header">
        </div>
        <div class="header-menu inline-block vrt-align-top">
            <nav class="header-menu-list">
                <a class="active" href="#">Home</a>
                <a href="#">Shop</a>
                <a href="#">Plant Care</a>
                <a href="#">Blogs</a>
            </nav>
        </div>
        <div class="header-btn inline-block vrt-align-top">
            <a href="#">
                <img src="img/logout.svg" alt="logout button, in the header">
            </a>
            <a href="#">Login</a>
        </div>

    </header>
    <!-- --------------------------            M A I N            -------------------------- -->    
    <main class="main container">
        <div class="main-banner fnt-sz0">
            <div class="main-banner-text">
                <div class="main-banner-text-blck1">
                    <h1 class="main-banner-text-welcome">
                        Welcome to GreenShop
                    </h1>
                    <p class="main-banner-text-motto">
                        Let’s Make a Better <span class="fnt-green">Planet</span>
                    </p>
                </div>
                <div class="main-banner-text-blck2">
                    <p class="main-banner-text-about">
                        We are an online plant shop offering a wide range of cheap and trendy plants. 
                        Use our plants to create an unique Urban Jungle. Order your favorite plants!
                    </p>
                    <button class="main-banner-btn btn">
                        SHOP NOW
                    </button>
                </div>
            </div>
            <div class="main-banner-img">
                <img src="img/01-img01.png" alt="Green shop, photo of a plant">
            </div>
        </div>
    </main>
    
</body>
</html>
